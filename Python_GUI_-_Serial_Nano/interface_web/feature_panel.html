<div class="imu-features">
    <span class="imu-features-title">Features</span>
    <span class="imu-metric">
        <span class="imu-metric-label">Période</span>
        <span class="imu-metric-value">{{period}}</span>
    </span>
    <span class="imu-metric">
        <span class="imu-metric-label">Moyenne</span>
        <span class="imu-metric-value">{{mean}}</span>
    </span>
    <span class="imu-metric">
        <span class="imu-metric-label">Écart-type</span>
        <span class="imu-metric-value">{{standard_deviation}}</span>
    </span>
    <span class="imu-metric">
        <span class="imu-metric-label">Variance</span>
        <span class="imu-metric-value">{{variance}}</span>
    </span>
    <span class="imu-metric">
        <span class="imu-metric-label">RMS</span>
        <span class="imu-metric-value">{{rms}}</span>
    </span>
    <span class="imu-metric imu-movement {{movement_state}}">
        <span class="imu-metric-label">Mouvement</span>
        <span class="imu-metric-value">{{movement}}</span>
    </span>
</div>
